<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/workouts" text=""></ion-back-button>
    </ion-buttons>
    <ion-title *ngIf="detail">Treino {{ detail.workout.letter }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-content ion-padding" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="empty" *ngIf="!loading && !detail">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>Treino não encontrado.</p>
    <ion-button fill="clear" color="primary" [routerLink]="['/tabs/workouts']">Voltar</ion-button>
  </div>

  <div class="page-content" *ngIf="!loading && detail">
    <div class="hero">
      <ion-icon name="barbell-outline"></ion-icon>
      <h2>{{ detail.workout.targetMuscle }}</h2>
      <p>Peso, séries e descanso entram na próxima etapa.</p>
    </div>
  </div>
</ion-content>
