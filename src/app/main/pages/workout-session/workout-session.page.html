<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/workouts" text=""></ion-back-button>
    </ion-buttons>
    <ion-title *ngIf="detail">Treino {{ detail.workout.letter }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-content ion-padding" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="empty" *ngIf="!loading && !detail">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>Treino não encontrado.</p>
    <ion-button fill="clear" color="primary" [routerLink]="['/tabs/workouts']">Voltar</ion-button>
  </div>

  <div class="page-content" *ngIf="!loading && detail">
    <p class="muscles">{{ detail.workout.targetMuscle }}</p>
    <p class="hint">Marque quando terminar. O treino entra no histórico.</p>

    <div class="exercise" *ngFor="let item of detail.exercises; let i = index">
      <div class="thumb">
        <ion-icon name="barbell-outline"></ion-icon>
      </div>
      <div class="texts">
        <h3>{{ i + 1 }}. {{ item.name }}</h3>
        <p>
          {{ item.sxr }}
          <span *ngIf="item.technique"> · {{ item.technique }}</span>
        </p>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border" *ngIf="detail">
  <div class="footer-inner">
    <ion-button expand="block" color="primary" [disabled]="saving" (click)="complete()">
      Concluir treino
    </ion-button>
  </div>
</ion-footer>
