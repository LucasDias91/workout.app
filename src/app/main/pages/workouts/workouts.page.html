<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="title-nav">
        <ion-button fill="clear" color="light" (click)="previous()" [disabled]="!hasPrevious">
          <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
        </ion-button>
        <span>Treinos</span>
        <ion-button fill="clear" color="light" (click)="next()" [disabled]="!hasNext">
          <ion-icon slot="icon-only" name="chevron-forward"></ion-icon>
        </ion-button>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-content ion-padding" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <div class="page-content" *ngIf="!loading">
    <div class="program-meta" *ngIf="program">
      <p>
        #{{ program.id }} · {{ program.type }} · {{ programDate }}
      </p>
      <span class="active-badge" *ngIf="program.isActive">Ativo</span>
      <button type="button" class="activate-link" *ngIf="!program.isActive" (click)="activateProgram()">
        Marcar como ativo
      </button>
    </div>

    <div class="empty" *ngIf="!workouts.length">
      <ion-icon name="barbell-outline"></ion-icon>
      <p>Nenhum treino neste ciclo.</p>
    </div>

    <div
      class="workout-card"
      *ngFor="let workout of workouts"
      [class.today]="workout.isToday"
      (click)="openWorkout(workout)">
      <div class="texts">
        <h2>Treino {{ workout.letter }}</h2>
        <p>{{ workout.targetMuscle }}</p>
      </div>
      <ion-button
        fill="clear"
        color="light"
        class="pin-button"
        (click)="activateWorkout(workout, $event)">
        <ion-icon slot="icon-only" [name]="workout.isToday ? 'bookmark' : 'bookmark-outline'"></ion-icon>
      </ion-button>
      <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
    </div>
  </div>
</ion-content>
