<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="page-title">Olá, Lucas!</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" color="light">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="home-content">
    <ion-card class="workout-card">
      <ion-card-header>
        <ion-card-subtitle>Treino do dia</ion-card-subtitle>
        <ion-card-title>Treino A</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p class="muted">Peito, ombro e tríceps</p>
        <ion-button expand="block" color="primary">
          Iniciar treino
        </ion-button>
      </ion-card-content>
    </ion-card>

    <p class="section-label">As próximas telas entram nas etapas seguintes.</p>
  </div>
</ion-content>
